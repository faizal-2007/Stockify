<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F7F8FA"/>
  <!-- Soft square background -->
  <rect x="40" y="40" width="120" height="120" rx="24" fill="#ECEEF2"/>
  <!-- Generic product outline -->
  <rect x="68" y="55" width="64" height="90" rx="8" fill="#D0D4DC" stroke="#B8BCC8" stroke-width="2"/>
  <!-- Camera dots -->
  <circle cx="85" cy="70" r="6" fill="#B8BCC8"/>
  <circle cx="98" cy="70" r="5" fill="#B8BCC8"/>
  <!-- Screen area -->
  <rect x="72" y="82" width="56" height="52" rx="4" fill="#C0C4CC"/>
  <!-- No image text -->
  <text x="100" y="175" text-anchor="middle" font-family="system-ui" font-size="11" fill="#98A2B3">No Image</text>
</svg>

