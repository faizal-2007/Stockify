<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F8FAFC"/>
  <!-- Screen Lid (Upright Display) -->
  <rect x="34" y="24" width="132" height="92" rx="6" fill="#1F2937"/>
  <rect x="38" y="28" width="124" height="84" rx="4" fill="#020617"/>
  <!-- Display Panel Glow -->
  <rect x="42" y="32" width="116" height="76" rx="2" fill="#60A5FA" opacity="0.14"/>
  <!-- Webcam -->
  <circle cx="100" cy="26" r="2" fill="#64748B"/>
  <circle cx="100" cy="26" r="0.8" fill="#020617"/>
  <!-- Brand logo inside screen -->
  <text x="100" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">APPLE</text>
  <!-- Hinge -->
  <rect x="65" y="116" width="70" height="5" rx="2" fill="#334155"/>
  <!-- Lower Chassis / Keyboard Base (Perspective Trapezoid) -->
  <polygon points="16,156 34,118 166,118 184,156" fill="#1F2937"/>
  <polygon points="18,154 35,119 165,119 182,154" fill="#9CA3AF" opacity="0.6"/>
  <!-- Keyboard Island -->
  <polygon points="36,144 48,122 152,122 164,144" fill="#0F172A"/>
  <!-- Key Row Lines -->
  <line x1="45" y1="127" x2="155" y2="127" stroke="#334155" stroke-width="1.5"/>
  <line x1="41" y1="133" x2="159" y2="133" stroke="#334155" stroke-width="1.5"/>
  <line x1="38" y1="139" x2="162" y2="139" stroke="#334155" stroke-width="1.5"/>
  <!-- Trackpad -->
  <rect x="85" y="146" width="30" height="8" rx="2" fill="#1E293B" stroke="#60A5FA" stroke-width="0.8" opacity="0.8"/>
  <!-- Label below -->
  <text x="100" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#475569">MacBook Air M2 (2022)</text>
</svg>