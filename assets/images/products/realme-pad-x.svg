<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F7F8FA"/>
  <!-- Realme Pad X - portrait, gold accent -->
  <rect x="42" y="18" width="116" height="164" rx="10" fill="#C9A84C"/>
  <rect x="46" y="22" width="108" height="156" rx="7" fill="#E8C66A"/>
  <!-- Screen area with bezel -->
  <rect x="50" y="26" width="100" height="148" rx="5" fill="#1A1A2E"/>
  <!-- Camera bar -->
  <rect x="50" y="26" width="100" height="22" rx="5" fill="#111"/>
  <circle cx="100" cy="37" r="5" fill="#222" stroke="#444" stroke-width="1"/>
  <!-- Volume -->
  <rect x="38" y="60" width="4" height="16" rx="2" fill="#C09040"/>
  <rect x="38" y="80" width="4" height="16" rx="2" fill="#C09040"/>
  <!-- Power -->
  <rect x="158" y="60" width="4" height="12" rx="2" fill="#C09040"/>
  <!-- Home indicator -->
  <rect x="82" y="168" width="36" height="4" rx="2" fill="#C09040"/>
  <text x="100" y="196" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B7280">Realme Pad X</text>
</svg>

