<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F8FAFC"/>
  <!-- Tablet Body -->
  <rect x="36" y="18" width="128" height="164" rx="12" fill="#172554"/>
  <rect x="40" y="22" width="120" height="156" rx="9" fill="#1E3A8A"/>
  <!-- Screen Glass -->
  <rect x="44" y="26" width="112" height="148" rx="7" fill="#0F172A"/>
  <!-- Screen Wallpaper / Ambient Accent -->
  <rect x="48" y="30" width="104" height="140" rx="5" fill="#3B82F6" opacity="0.18"/>
  <!-- Front Camera -->
  <circle cx="100" cy="24" r="2.5" fill="#64748B"/>
  <circle cx="100" cy="24" r="1" fill="#020617"/>
  <!-- Brand Badge inside screen -->
  <rect x="76" y="88" width="48" height="14" rx="4" fill="#1E3A8A" opacity="0.6"/>
  <text x="100" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" letter-spacing="1">SAMSUNG</text>
  <!-- Home Indicator bar -->
  <rect x="82" y="168" width="36" height="3" rx="1.5" fill="#64748B"/>
  <!-- Label below -->
  <text x="100" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#475569">Galaxy Tab A9+ (Wi-Fi)</text>
</svg>