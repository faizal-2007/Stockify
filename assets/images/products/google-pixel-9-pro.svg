<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F7F8FA"/>
  <!-- Phone body -->
  <rect x="68" y="20" width="64" height="160" rx="12" fill="#1C1C1E"/>
  <rect x="72" y="28" width="56" height="140" rx="8" fill="#2C2C2E"/>
  <!-- Back camera -->
  <circle cx="88" cy="52" r="12" fill="#111" stroke="#444" stroke-width="1.5"/>
  <circle cx="88" cy="52" r="6" fill="#000"/>
  <circle cx="112" cy="52" r="10" fill="#111" stroke="#444" stroke-width="1.5"/>
  <circle cx="112" cy="52" r="5" fill="#000"/>
  <!-- Screen -->
  <rect x="76" y="78" width="48" height="78" rx="4" fill="#0D47A1"/>
  <!-- Google logo hint -->
  <circle cx="100" cy="30" r="3" fill="#444"/>
  <!-- Side button -->
  <rect x="132" y="72" width="4" height="24" rx="2" fill="#333"/>
  <rect x="64" y="68" width="4" height="18" rx="2" fill="#333"/>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B7280">Pixel 9 Pro</text>
</svg>

