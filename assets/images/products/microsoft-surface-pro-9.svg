<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F7F8FA"/>
  <!-- Surface Pro - landscape-ish, 2-in-1 -->
  <!-- Kickstand suggestion -->
  <rect x="140" y="60" width="8" height="90" rx="2" fill="#D0D0D0" transform="rotate(10 144 105)"/>
  <!-- Main tablet body -->
  <rect x="22" y="38" width="148" height="110" rx="8" fill="#C8C8C8"/>
  <rect x="26" y="42" width="140" height="102" rx="5" fill="#E8E8E8"/>
  <!-- Screen -->
  <rect x="30" y="46" width="132" height="94" rx="4" fill="#1A237E"/>
  <!-- Camera front -->
  <circle cx="96" cy="44" r="3" fill="#B0B0B0"/>
  <!-- Windows button on bottom -->
  <circle cx="96" cy="148" r="5" fill="#B0B0B0"/>
  <!-- Volume -->
  <rect x="22" y="58" width="4" height="12" rx="2" fill="#B0B0B0"/>
  <rect x="22" y="74" width="4" height="12" rx="2" fill="#B0B0B0"/>
  <!-- Power/fingerprint -->
  <rect x="166" y="58" width="4" height="10" rx="2" fill="#B0B0B0"/>
  <!-- Type Cover hint -->
  <rect x="22" y="150" width="148" height="30" rx="4" fill="#D8D8D8"/>
  <rect x="26" y="154" width="140" height="22" rx="2" fill="#C8C8C8"/>
  <text x="96" y="196" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B7280">Surface Pro 9</text>
</svg>

