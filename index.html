<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockify — Smart Inventory Management</title>

  <!-- Apply theme before render to avoid FOUC -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('stockify.settings');
        if (raw) {
          var settings = JSON.parse(raw);
          if (settings && settings.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

<!-- ══════════════════════════════════════
     APP FRAME
══════════════════════════════════════ -->
<div class="app-canvas">
  <div class="app-frame" id="app-frame">

    <!--
      Top bar is injected here by topbar.js
    -->

    <!-- App body: side rail + main content -->
    <div class="app-body" id="app-body">

      <!--
        Side rail is injected here by sidebar.js
      -->

      <!-- Main content area -->
      <main class="app-content" id="app-content" role="main" aria-label="Main content">
        <!-- Router renders views here -->
        <div class="empty-state" style="margin-top: 80px;">
          <div class="skeleton" style="width:200px;height:24px;"></div>
        </div>
      </main>

    </div><!-- /app-body -->

  </div><!-- /app-frame -->
</div><!-- /app-canvas -->

<!-- Toast container is created by toast.js -->

══════════════════════════════════════ -->
